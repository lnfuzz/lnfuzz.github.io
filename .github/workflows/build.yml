name: Build site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A check on a superseded commit tells nobody anything, so cancel it.
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and check
        uses: ./.github/actions/build-site
