# Bugs found by lnfuzz projects, rendered at /bugs/ and on project pages.
#
# Validated at build time by layouts/bugs.html, which fails the build on a
# missing id/title/target/status or on a value outside these enums:
#
#   target:  lnd | cln | ldk | eclair | spec
#   status:  fixed | reported | wontfix
#   impact:  theft | grief | dos | crash | debug-assert | ub | uninit |
#            liveness | spec | race
#
# `found_with` is how the bug was discovered. Optional. /projects/smite/ renders
# the entries whose value is `smite`.
#
# `credit` is a list of keys from data/authors.yaml naming whoever investigated
# and reported that bug. An unknown key renders as a plain name, so someone with
# no entry there still gets credited.
#
# `advisory` is the slug of a page under /advisories/, not its LNF id.
#
# `fix` takes one URL or a list of them.

